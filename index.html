<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>冯铭谦的工作台</title>
<!-- ========== 新增PWA配置 ========== -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#3b82f6">
<!-- ================================= -->
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system}
body{background:#f3f4f6;color:#1f2937;padding:16px;max-width:720px;margin:0 auto}
.header{margin-bottom:18px}
.header h2{font-size:22px}
.header .sub{color:#6b7280;margin-top:4px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px #00000010}
.card h3{margin-bottom:10px;font-size:17px}
.todo-item{display:flex;gap:8px;align-items:center;margin:8px 0}
input,textarea{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;margin:6px 0}
button{background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:9px 14px;cursor:pointer}
.timer-display{font-size:36px;text-align:center;margin:12px 0;font-weight:bold}
.tab-bar{display:flex;gap:4px;margin-top:20px}
.tab-bar button{flex:1;background:#e5e7eb;color:#222;font-size:13px;padding:8px}
.tab-bar button.active{background:#3b82f6;color:#fff}
.tab-content{display:none}
.tab-content.active{display:block}
#installBtn{width:100%;margin:10px 0;background:#10b981}
</style>
</head>
<body>
<div class="header">
  <h2>冯铭谦的工作台</h2>
  <div class="sub">今日重点：完成 WORKBUDDY 作业截图</div>
</div>

<!-- 安装按钮 -->
<button id="installBtn" disabled>📥 安装为应用</button>

<div class="card">
  <h3>待办清单</h3>
  <div id="todoList"></div>
  <div style="display:flex;gap:6px">
    <input id="todoInput" placeholder="添加待办事项">
    <button onclick="addTodo()">添加</button>
  </div>
</div>

<div class="card">
  <h3>专注计时器（25分钟）</h3>
  <div class="timer-display" id="timer">25:00</div>
  <div style="display:flex;gap:6px">
    <button onclick="startTimer()">开始</button>
    <button onclick="pauseTimer()">暂停</button>
    <button onclick="resetTimer()">重置</button>
  </div>
</div>

<div class="card">
  <h3>课表</h3>
  <div>数据结构｜大学英语｜计算机组成原理</div>
</div>

<div class="card">
  <h3>速记</h3>
  <textarea id="note" rows="4" placeholder="在这里记录文字"></textarea>
  <button onclick="saveNote()">保存速记</button>
</div>

<div class="card">
  <h3>记账</h3>
  <input id="moneyInput" placeholder="金额，备注">
  <button onclick="saveBill()">记录</button>
  <div id="billList"></div>
</div>

<!-- 底部标签 -->
<div class="tab-bar">
  <button class="active" data-tab="all">待办</button>
  <button data-tab="focus">专注</button>
  <button data-tab="schedule">课表</button>
  <button data-tab="note">速记</button>
  <button data-tab="bill">记账</button>
</div>

<script>
// ========== 待办 ==========
let todoList = JSON.parse(localStorage.getItem("todoList")) || [];
function renderTodo(){
  const wrap = document.getElementById("todoList");
  wrap.innerHTML = "";
  todoList.forEach((item,i)=>{
    wrap.innerHTML += `<div class="todo-item">
      <input type="checkbox" ${item.done?"checked":""} onchange="toggleTodo(${i})">
      <span style="${item.done?"text-decoration:line-through;color:#888":""}">${item.text}</span>
      <button onclick="delTodo(${i})" style="background:#ef4444;padding:4px 8px">×</button>
    </div>`
  })
}
function addTodo(){
  const val = document.getElementById("todoInput").value.trim();
  if(!val)return;
  todoList.push({text:val,done:false});
  localStorage.setItem("todoList",JSON.stringify(todoList));
  document.getElementById("todoInput").value="";renderTodo();
}
function toggleTodo(i){todoList[i].done=!todoList[i].done;localStorage.setItem("todoList",JSON.stringify(todoList));renderTodo()}
function delTodo(i){todoList.splice(i,1);localStorage.setItem("todoList",JSON.stringify(todoList));renderTodo()}
renderTodo();

// ========== 速记 ==========
const noteDom = document.getElementById("note");
noteDom.value = localStorage.getItem("workNote")||"";
function saveNote(){localStorage.setItem("workNote",noteDom.value);alert("已保存")}

// ========== 记账 ==========
let bills = JSON.parse(localStorage.getItem("billList"))||[];
function renderBill(){
  const wrap = document.getElementById("billList");
  wrap.innerHTML = bills.map(x=>`<div>${x.txt}</div>`).join("")
}
function saveBill(){
  const txt = document.getElementById("moneyInput").value.trim();
  if(!txt)return;
  bills.push({txt});
  localStorage.setItem("billList",JSON.stringify(bills));
  document.getElementById("moneyInput").value="";renderBill();
}
renderBill();

// ========== 25分钟计时器 ==========
let timerId = null;
let leftSec = 25*60;
function updateTimer(){
  const m = String(Math.floor(leftSec/60)).padStart(2,"0");
  const s = String(leftSec%60).padStart(2,"0");
  document.getElementById("timer").innerText = `${m}:${s}`
}
function startTimer(){
  if(timerId)return;
  timerId = setInterval(()=>{
    if(leftSec>0){leftSec--;updateTimer()}
    else{clearInterval(timerId);timerId=null;alert("时间到！")}
  },1000)
}
