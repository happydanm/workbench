<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>冯铭谦的工作台</title>
<meta name="theme-color" content="#E9EDF2">
<meta name="description" content="冯铭谦的个人工作台：待办、专注、课表、速记、记账、资料，一屏搞定。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="工作台">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">

  <header class="top">
    <span class="top-date"><span id="date">11月19日 · 周四</span><span class="sep">/</span><span id="week">第 47 周</span></span>
    <span class="avatar" aria-hidden="true">冯</span>
  </header>

  <section class="who">
    <p class="hi" id="greet">上午好</p>
    <h1>冯铭谦</h1>
  </section>

  <section class="card hero" aria-labelledby="heroTitle">
    <div class="hero-row">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120" role="img" aria-label="今日完成进度">
          <circle class="ring-track" cx="60" cy="60" r="52"></circle>
          <circle class="ring-bar" id="ringBar" cx="60" cy="60" r="52"></circle>
        </svg>
        <span class="ring-num"><span id="doneCount">1</span><span class="ring-slash">/</span><span id="allCount">4</span></span>
      </div>
      <div class="hero-text">
        <span class="label" id="heroTitle">今日重点</span>
        <p class="next" id="nextTask">完成 WORKBUDDY 作业截图</p>
        <span class="meta" id="heroMeta">还有 3 件事</span>
      </div>
    </div>
  </section>

  <section class="bento">

    <article class="card span2 tasks" id="tasks" aria-labelledby="taskTitle">
      <div class="card-head">
        <h2 id="taskTitle">待办<span class="count" id="taskCount">3</span></h2>
        <button class="ghost-btn" id="clearDone" type="button">清空已完成</button>
      </div>
      <ul class="task-list" id="taskList"></ul>
      <form class="add-row" id="addForm" autocomplete="off">
        <input id="addInput" type="text" placeholder="加一件要做的事…" maxlength="40" aria-label="新的待办">
        <button class="add-btn" type="submit" aria-label="添加待办">＋</button>
      </form>
    </article>

    <article class="card timer" id="timer" aria-labelledby="timerTitle">
      <div class="card-head">
        <h2 id="timerTitle">专注</h2>
        <span class="mode">25 分钟</span>
      </div>
      <p class="timer-num" id="timerNum">25:00</p>
      <div class="timer-actions">
        <button class="primary-btn" id="startBtn" type="button">开始</button>
        <button class="ghost-btn" id="resetBtn" type="button">重置</button>
      </div>
    </article>

    <article class="card memo" id="memo" aria-labelledby="memoTitle">
      <div class="card-head">
        <h2 id="memoTitle">速记</h2>
        <span class="mode" id="noteState">自动保存</span>
      </div>
      <textarea id="noteBox" class="note-box" rows="3" placeholder="随手记点什么…"></textarea>
    </article>

    <article class="card span2 sched" id="schedule" aria-labelledby="schedTitle">
      <div class="card-head">
        <h2 id="schedTitle">今天的课</h2>
        <span class="mode" id="schedDay">周四</span>
      </div>
      <ol class="sched-list">
        <li><span class="t">08:00</span><span class="n">数据结构</span><span class="r">A302</span></li>
        <li><span class="t">10:00</span><span class="n">大学英语</span><span class="r">B105</span></li>
        <li><span class="t">14:00</span><span class="n">计算机组成</span><span class="r">C211</span></li>
      </ol>
    </article>

  </section>

  <nav class="dock" aria-label="工作台模块">
    <button class="dock-item" type="button" data-target="tasks">
      <span class="dock-icon i-check"></span><span>待办</span>
    </button>
    <button class="dock-item" type="button" data-target="timer">
      <span class="dock-icon i-timer"></span><span>专注</span>
    </button>
    <button class="dock-item" type="button" data-target="schedule">
      <span class="dock-icon i-cal"></span><span>课表</span>
    </button>
    <button class="dock-item" type="button" data-target="memo">
      <span class="dock-icon i-note"></span><span>速记</span>
    </button>
    <button class="dock-item" type="button" data-sheet="ledger">
      <span class="dock-icon i-wallet"></span><span>记账</span>
    </button>
    <button class="dock-item" type="button" data-sheet="links">
      <span class="dock-icon i-doc"></span><span>资料</span>
    </button>
  </nav>

  <footer class="foot">
    <span class="sign">冯铭谦 · 个人工作台</span>
    <span class="sep">·</span>
    <span>数据只存在本机</span>
  </footer>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="backdrop" id="backdrop" hidden></div>

<section class="sheet" id="sheet-ledger" role="dialog" aria-modal="true" aria-labelledby="ledgerTitle" hidden>
  <div class="sheet-head">
    <h2 id="ledgerTitle">记账</h2>
    <button class="icon-btn" type="button" data-close aria-label="关闭">×</button>
  </div>

  <div class="sum-row">
    <div class="sum">
      <span class="sum-label">今日支出</span>
      <span class="sum-num" id="outSum">¥0.00</span>
    </div>
    <div class="sum">
      <span class="sum-label">今日收入</span>
      <span class="sum-num" id="inSum">¥0.00</span>
    </div>
  </div>

  <form class="ledger-form" id="ledgerForm" autocomplete="off">
    <input id="ledgerAmount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="金额" aria-label="金额">
    <input id="ledgerNote" type="text" maxlength="20" placeholder="花在哪了" aria-label="备注">
    <div class="seg" role="group" aria-label="收支类型">
      <button class="seg-btn is-on" type="button" data-type="out">支出</button>
      <button class="seg-btn" type="button" data-type="in">收入</button>
    </div>
    <button class="primary-btn" type="submit">记一笔</button>
  </form>

  <ul class="ledger-list" id="ledgerList"></ul>
</section>

<section class="sheet" id="sheet-links" role="dialog" aria-modal="true" aria-labelledby="linksTitle" hidden>
  <div class="sheet-head">
    <h2 id="linksTitle">资料</h2>
    <button class="icon-btn" type="button" data-close aria-label="关闭">×</button>
  </div>

  <form class="links-form" id="linksForm" autocomplete="off">
    <input id="linkName" type="text" maxlength="12" placeholder="名称" aria-label="名称">
    <input id="linkUrl" type="text" placeholder="链接" aria-label="链接">
    <button class="primary-btn span2" type="submit">添加到资料</button>
  </form>

  <ul class="link-list" id="linkList"></ul>
</section>

<script src="app.js"></script>
</body>
</html>
